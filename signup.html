<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | FixConnect AI</title>
    <meta
      name="description"
      content="Create your FixConnect AI account and connect with trusted home-service professionals."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="FixConnect AI home">
          <span class="brand-mark">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 8 12 24v28h40V24L32 8Zm-1 12h2v12h-2V20Zm0 16h2v2h-2v-2Z" />
            </svg>
          </span>
          <span class="brand-text">FixConnect AI</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="services.html">Services</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="login.html">Login</a>
          <a href="signup.html" class="active">Sign Up</a>
          <a href="emergency.html" class="nav-button nav-button-accent">Emergency SOS</a>
        </nav>
      </div>
    </header>

    <main class="signup-page">
      <div class="signup-shell">
        <section class="signup-visual" aria-label="Modern smart home security illustration">
          <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" class="home-illustration">
            <!-- Background gradient circles -->
            <defs>
              <linearGradient id="homeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#eef6ff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#d4e7fb;stop-opacity:1" />
              </linearGradient>
              <linearGradient id="houseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#1c6fe5;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#123d69;stop-opacity:1" />
              </linearGradient>
              <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
                <stop offset="0%" style="stop-color:#1c6fe5;stop-opacity:0.2" />
                <stop offset="100%" style="stop-color:#1c6fe5;stop-opacity:0" />
              </radialGradient>
            </defs>

            <!-- Background -->
            <rect width="400" height="500" fill="url(#homeGradient)"/>

            <!-- Decorative circles in background -->
            <circle cx="350" cy="80" r="60" fill="#1c6fe5" opacity="0.08"/>
            <circle cx="80" cy="420" r="80" fill="#123d69" opacity="0.08"/>

            <!-- Subtle network lines (AI/smart home concept) -->
            <line x1="120" y1="200" x2="280" y2="200" stroke="#2b7dff" stroke-width="2" opacity="0.15" stroke-dasharray="5,5"/>
            <circle cx="120" cy="200" r="4" fill="#2b7dff" opacity="0.3"/>
            <circle cx="280" cy="200" r="4" fill="#2b7dff" opacity="0.3"/>
            <circle cx="200" cy="200" r="3" fill="#2b7dff" opacity="0.4"/>

            <!-- Main house structure -->
            <g id="house">
              <!-- House body -->
              <rect x="100" y="220" width="200" height="140" rx="8" fill="url(#houseGradient)" stroke="#061a36" stroke-width="3"/>
              
              <!-- Roof -->
              <polygon points="100,220 200,120 300,220" fill="#2b7dff" stroke="#061a36" stroke-width="3"/>
              
              <!-- Door -->
              <rect x="175" y="310" width="50" height="80" rx="4" fill="#061a36" stroke="#1c6fe5" stroke-width="2"/>
              <circle cx="220" cy="350" r="3" fill="#eef6ff"/>
              
              <!-- Window 1 (left) -->
              <rect x="125" y="250" width="35" height="35" rx="4" fill="#e7f2ff" stroke="#061a36" stroke-width="2"/>
              <line x1="142.5" y1="250" x2="142.5" y2="285" stroke="#061a36" stroke-width="1.5"/>
              <line x1="125" y1="267.5" x2="160" y2="267.5" stroke="#061a36" stroke-width="1.5"/>
              
              <!-- Window 2 (right) -->
              <rect x="240" y="250" width="35" height="35" rx="4" fill="#e7f2ff" stroke="#061a36" stroke-width="2"/>
              <line x1="257.5" y1="250" x2="257.5" y2="285" stroke="#061a36" stroke-width="1.5"/>
              <line x1="240" y1="267.5" x2="275" y2="267.5" stroke="#061a36" stroke-width="1.5"/>
            </g>

            <!-- Security lock icon with glow -->
            <g id="security-lock">
              <circle cx="240" cy="140" r="35" fill="url(#glowEffect)"/>
              
              <!-- Lock background circle -->
              <circle cx="240" cy="140" r="32" fill="#fff" stroke="#1c6fe5" stroke-width="2.5"/>
              
              <!-- Lock shackle (top part) -->
              <path d="M 225 140 Q 225 115 240 115 Q 255 115 255 140" fill="none" stroke="#1c6fe5" stroke-width="4" stroke-linecap="round"/>
              
              <!-- Lock body -->
              <rect x="220" y="140" width="40" height="32" rx="3" fill="#1c6fe5" stroke="#1c6fe5" stroke-width="2"/>
              
              <!-- Lock keyhole -->
              <circle cx="240" cy="150" r="4" fill="#fff"/>
              <rect x="238" y="156" width="4" height="8" rx="2" fill="#fff"/>
            </g>

            <!-- Smart home indicator lines -->
            <g opacity="0.2">
              <line x1="280" y1="140" x2="310" y2="140" stroke="#2b7dff" stroke-width="2" stroke-linecap="round"/>
              <line x1="290" y1="130" x2="310" y2="120" stroke="#2b7dff" stroke-width="2" stroke-linecap="round"/>
              <line x1="290" y1="150" x2="310" y2="160" stroke="#2b7dff" stroke-width="2" stroke-linecap="round"/>
              <circle cx="315" cy="140" r="3" fill="#2b7dff"/>
            </g>

            <!-- Bottom decorative element -->
            <rect x="140" y="400" width="120" height="4" rx="2" fill="#2b7dff" opacity="0.3"/>
          </svg>
        </section>

        <section class="signup-card" aria-label="Sign up form">
          <div class="card-header">
            <div class="auth-brand" aria-label="FixConnect AI logo">
              <span class="brand-mark small-brand-mark">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                  <path d="M32 8 12 24v28h40V24L32 8Zm-1 12h2v12h-2V20Zm0 16h2v2h-2v-2Z" />
                </svg>
              </span>
              <span class="auth-brand-text">FixConnect AI</span>
            </div>

            <h1>Create Your Account</h1>
            <p class="auth-subtitle">
              Join FixConnect AI and connect with trusted home-service professionals.
            </p>
          </div>

          <div class="role-picker" aria-label="Account role selection">
            <button type="button" class="role-option active" data-role="customer" aria-pressed="true">
              Customer
            </button>
            <button type="button" class="role-option" data-role="provider" aria-pressed="false">
              Service Provider
            </button>
          </div>

          <form id="signupForm" class="signup-form" novalidate>
            <div class="input-row">
              <div class="input-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrap">
                  <span class="input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
                  </span>
                  <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" />
                </div>
              </div>
            </div>

            <div class="input-row two-column">
              <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                  <span class="input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M3 6.75A2.75 2.75 0 0 1 5.75 4h12.5A2.75 2.75 0 0 1 21 6.75v10.5A2.75 2.75 0 0 1 18.25 20H5.75A2.75 2.75 0 0 1 3 17.25V6.75Zm2.1-.75 6.9 5.1 6.9-5.1H5.1Zm13.15 2.05-6.2 4.59a1 1 0 0 1-1.1 0L5.75 8.1v9.15c0 .41.34.75.75.75h10.99c.41 0 .75-.34.75-.75V8.1Z"/></svg>
                  </span>
                  <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" />
                </div>
              </div>

              <div class="input-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrap">
                  <span class="input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.57 15.57 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.57 1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg>
                  </span>
                  <input id="phone" name="phone" type="tel" placeholder="+91 98765 43210" autocomplete="tel" />
                </div>
              </div>
            </div>

            <div class="input-row two-column">
              <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                  <span class="input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M17 9V7A5 5 0 0 0 7 7v2H5.75A1.75 1.75 0 0 0 4 10.75v8.5C4 20.2 4.8 21 5.75 21h12.5c.95 0 1.75-.8 1.75-1.75v-8.5A1.75 1.75 0 0 0 18.25 9H17Zm-8 0V7a3 3 0 0 1 6 0v2H9Zm4 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
                  </span>
                  <input id="password" name="password" type="password" placeholder="Create password" autocomplete="new-password" />
                </div>
              </div>

              <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrap">
                  <span class="input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M17 9V7A5 5 0 0 0 7 7v2H5.75A1.75 1.75 0 0 0 4 10.75v8.5C4 20.2 4.8 21 5.75 21h12.5c.95 0 1.75-.8 1.75-1.75v-8.5A1.75 1.75 0 0 0 18.25 9H17Zm-8 0V7a3 3 0 0 1 6 0v2H9Zm4 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
                  </span>
                  <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" autocomplete="new-password" />
                </div>
              </div>
            </div>

            <p id="formMessage" class="form-message" aria-live="polite"></p>

            <button type="submit" class="primary-button">Create Account</button>

            <div class="divider" aria-label="Separator"><span>OR</span></div>

            <button type="button" class="google-button" aria-label="Continue with Google">
              <span class="google-mark" aria-hidden="true">
                <span class="blue">G</span>
              </span>
              Continue with Google
            </button>

            <p class="signin-copy">
              Already have an account?
              <a href="login.html">Sign In</a>
            </p>
          </form>
        </section>
      </div>
    </main>

    <script>
      const form = document.getElementById('signupForm');
      const formMessage = document.getElementById('formMessage');
      const roleButtons = document.querySelectorAll('.role-option');
      const fullName = document.getElementById('fullName');
      const email = document.getElementById('email');
      const phone = document.getElementById('phone');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');

      let selectedRole = 'customer';

      function updateRole(role) {
        selectedRole = role;
        roleButtons.forEach((button) => {
          const active = button.dataset.role === role;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
      }

      roleButtons.forEach((button) => {
        button.addEventListener('click', () => updateRole(button.dataset.role));
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const values = {
          fullName: fullName.value.trim(),
          email: email.value.trim(),
          phone: phone.value.trim(),
          password: password.value.trim(),
          confirmPassword: confirmPassword.value.trim(),
        };

        if (!values.fullName || !values.email || !values.phone || !values.password || !values.confirmPassword) {
          formMessage.textContent = 'Please complete all fields before creating your account.';
          formMessage.classList.add('error');
          formMessage.classList.remove('success');
          return;
        }

        if (values.password.length < 6) {
          formMessage.textContent = 'Password must be at least 6 characters long.';
          formMessage.classList.add('error');
          formMessage.classList.remove('success');
          return;
        }

        if (values.password !== values.confirmPassword) {
          formMessage.textContent = 'Passwords do not match. Please re-enter them.';
          formMessage.classList.add('error');
          formMessage.classList.remove('success');
          return;
        }

        formMessage.textContent = 'Account details validated. Redirecting to your dashboard...';
        formMessage.classList.remove('error');
        formMessage.classList.add('success');

        const destination = selectedRole === 'customer' ? 'customer-dashboard.html' : 'provider-dashboard.html';
        window.location.href = destination;
      });

      updateRole(selectedRole);
    </script>
  </body>
</html>
