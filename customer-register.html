<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - FixConnect AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">
    
</head>

<body>

<div class="register-container">
<div class="register-illustration register-home" aria-hidden="true">
    <svg viewBox="0 0 24 24">
        <path d="M3 11.5 12 4l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z"/>
    </svg>
</div>

<div class="register-illustration register-lock" aria-hidden="true">
    <svg viewBox="0 0 24 24">
        <path d="M17 9V7a5 5 0 0 0-10 0v2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-2Zm-8-2a3 3 0 0 1 6 0v2H9V7Zm3 7a1.5 1.5 0 1 0 1 2.8V19h-2v-2.2A1.5 1.5 0 0 0 12 14Z"/>
    </svg>
</div>
    <div class="register-box">
        <h1>FixConnect <span>AI</span></h1>
        <div class="signup-role-picker">
    <a href="customer-register.html" class="signup-role active">
        Customer
    </a>

    <a href="provider-register.html" class="signup-role">
        Service Provider
    </a>
</div>
        <h2>Customer Registration</h2>
        <p class="subtitle">Create your account and get trusted services.</p>

        <form action="customer-dashboard.html">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter mobile number" required>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Address</label>
            <textarea placeholder="Enter your address" required></textarea>

            <label>Password</label>
            <input type="password" placeholder="Create password" required>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password" required>

            <button type="submit">Create Customer Account</button>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p class="back-text">
            <a href="login.html">← Back to Login</a>
        </p>
    </div>

</div>

</body>
</html>
